name: unit-tests

on:
  push:
    branches: [checkpointing, main]
  pull_request:
    branches: [checkpointing, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest numpy
      - name: Run WitFoo pipeline unit tests
        run: pytest tests/test_witfoo_parser.py tests/test_witfoo_analysis.py -v
